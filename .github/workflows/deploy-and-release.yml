name: Managed PaaS & GHCR Hybrid Delivery

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify (Tests & Schema)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run all checks via validator
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./scripts/validate_prompts.sh

  vibe-audit:
    name: Full-Spectrum Vibe Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run Full-Spectrum Vibe Monitor
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY_SHADOW }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run promptops vibe --coverage universal --budget-cap 10.0

  deploy-visual-editor:
    name: Deploy Visual Editor (Streamlit Cloud)
    runs-on: ubuntu-latest
    needs: [verify, vibe-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run Playwright Install
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run playwright install --with-deps chromium

      - name: Run Studio Deployment Readiness Tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run pytest tests/test_studio.py
          uv run pytest tests/test_shared_list.py
          uv run pytest tests/test_studio_accessibility.py

      - name: Log Streamlit Cloud Status
        run: |
          echo "### 🚀 Streamlit Cloud Deployment Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "Continuous Deployment triggered!" >> $GITHUB_STEP_SUMMARY
            echo "Streamlit Cloud is actively deploying the latest changes from the main branch." >> $GITHUB_STEP_SUMMARY
            echo "Access the live app at: [Streamlit Cloud Share URL (Simulated/Configured)](https://share.streamlit.io/)" >> $GITHUB_STEP_SUMMARY
            echo "Live visual playground URL: https://share.streamlit.io/"
          else
            echo "Pull Request Deployment Validation Passed." >> $GITHUB_STEP_SUMMARY
            echo "All Studio application checks succeeded. Ready for merge to main." >> $GITHUB_STEP_SUMMARY
            echo "Continuous Integration successful. Target deploy URL on merge: https://share.streamlit.io/"
          fi

  build-sdk:
    name: Build SDK Package
    runs-on: ubuntu-latest
    needs: [verify, vibe-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv build --package promptops

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist/

  publish-sdk:
    name: Publish SDK to PyPI
    runs-on: ubuntu-latest
    needs: [build-sdk]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  build-server-image:
    name: Build & Publish Server Image (GHCR)
    runs-on: ubuntu-latest
    needs: [verify, vibe-audit]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert image name to lowercase
        id: prep
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/mcp-server
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo "image=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
